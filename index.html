<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bimo Chicken</title>
<style>
  :root{
    --dark:#241209;
    --accent:#e0521e;
    --accent-2:#f2a71b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    overflow:hidden;
  }

  #splash{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    background:linear-gradient(160deg, var(--dark), var(--accent) 140%);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    transition:opacity .15s ease, transform .15s ease;
  }
  #splash.hide{
    opacity:0;
    transform:scale(1.08);
    pointer-events:none;
  }
  #splash img{
    width:120px;
    height:120px;
    object-fit:contain;
    border-radius:50%;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
    animation:pop .6s ease;
  }
  #splash h1{
    margin:0;
    color:#fff;
    font-size:1.7rem;
    letter-spacing:.5px;
    text-align:center;
    animation:fadeUp .7s ease;
  }
  #splash p{
    margin:0;
    color:#ffe3c8;
    font-size:.95rem;
    letter-spacing:2px;
    text-transform:uppercase;
    animation:fadeUp .9s ease;
  }
  @keyframes pop{
    from{transform:scale(.6);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  @keyframes fadeUp{
    from{transform:translateY(14px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
</style>
</head>
<body>

  <div id="splash">
    <img src="logo brimochicken.jpg" alt="Logo Brimo Chicken">
    <h1>Bienvenue chez Brimo Chicken</h1>
  </div>

<script>
  // Après 1.5s, l'écran d'intro disparaît.
  // Remplace la ligne ci-dessous par une redirection si besoin :
  // window.location.href = "ta-page-suivante.html";
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    window.location.href = "brimochicken_city_selection_fixed.html";
  }, 1500);
</script>

</body>
</html>
